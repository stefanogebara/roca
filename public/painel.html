<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Stevi · Painel</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    /* Sistema de design v2 (web/README.md). Os nomes antigos (--green, --line…)
       ficam como apelidos porque o JS ainda os usa em estilos inline. */
    :root {
      --creme: #F4F0E4; --creme-2: #EAE4D2; --tinta: #15130F; --tinta-2: #2A2620;
      --cinza: #6D675C; --cinza-claro: #A9A292; --linha: rgba(21,19,15,.14);
      --cereja: #D6321B; --folha: #2E6E3C; --folha-bg: #DCEBDD;
      --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --corpo: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
      --monof: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --ease: cubic-bezier(.32,.72,0,1);
      /* apelidos legados */
      --green: var(--tinta); --green-2: var(--tinta-2); --leaf: var(--folha);
      --cream: var(--creme); --card: #FBF9F3; --ink: var(--tinta); --muted: var(--cinza);
      --line: var(--linha); --amber: #8A5A0A; --red: var(--cereja);
      --shadow: none; --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    html { color-scheme: light; }
    body {
      font-family: var(--corpo); color: var(--tinta); background: var(--creme);
      -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.5;
    }
    .serif { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; line-height: .9; }
    .mono { font-family: var(--monof); }
    a { color: var(--tinta); }
    :focus-visible { outline: 3px solid var(--cereja); outline-offset: 2px; }

    /* Login — bloco escuro, mesma voz do hero */
    #login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--tinta); color: var(--creme); }
    .login-card { width: 100%; max-width: 400px; text-align: left; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand .mark { display: none; }
    .brand .serif { display: inline-flex; align-items: baseline; gap: .15em; }
    .brand .serif::after { content: ""; width: .38em; height: .38em; border-radius: 50%; background: var(--cereja); transform: translateY(.06em); }
    .login-card h1 { font-size: clamp(3.5rem, 12vw, 5.5rem); margin: 18px 0 8px; line-height: .86; }
    .login-card p { color: var(--cinza-claro); margin: 0 0 26px; font-size: 14px; }
    input[type=password], input[type=text] { width: 100%; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 10px; font: inherit; background: #FBF9F3; color: var(--tinta); }
    #login input[type=password] { background: transparent; border-color: rgba(244,240,228,.35); color: var(--creme); min-height: 48px; }
    #login input::placeholder { color: var(--cinza-claro); }
    input:focus { outline: 2px solid var(--cereja); outline-offset: 2px; border-color: transparent; }
    button { font: inherit; cursor: pointer; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 44px; background: var(--tinta); color: var(--creme); border: 1px solid var(--tinta); border-radius: 999px; padding: 0 18px; font-weight: 500; width: 100%; margin-top: 12px; transition: background-color .35s var(--ease), color .35s var(--ease), transform .35s var(--ease); }
    .btn:hover { background: var(--tinta-2); transform: translateY(-1px); }
    #login .btn { background: var(--creme); color: var(--tinta); border-color: var(--creme); }
    #login .btn:hover { background: #fff; }
    .btn.small { width: auto; min-height: 36px; padding: 0 14px; font-size: 13px; margin: 0; }
    .btn.ghost { background: transparent; color: var(--tinta); border: 1px solid var(--tinta); }
    .btn.ghost:hover { background: var(--creme-2); }
    .err { color: #F19A8C; font-size: 13px; margin-top: 10px; min-height: 16px; }

    /* App shell */
    #app { display: none; max-width: 1120px; margin: 0 auto; padding: 0 24px 60px; }
    header.top { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 14px; }
    header.top .brand h1 { font-size: 28px; margin: 0; color: var(--tinta) !important; }
    header.top .brand { justify-content: flex-start; }
    .tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--linha); margin-bottom: 24px; }
    .tab { background: none; border: none; padding: 12px 14px; min-height: 44px; color: var(--cinza); font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .35s var(--ease); }
    .tab:hover { color: var(--tinta); }
    .tab.active { color: var(--tinta); border-bottom-color: var(--cereja); }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Stat cards — número em display, sem sombra */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .stat { background: transparent; border: 0; border-top: 1px solid var(--tinta); border-radius: 0; padding: 14px 0 6px; box-shadow: none; }
    .stat .n { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .9; color: var(--tinta); font-variant-numeric: tabular-nums; }
    .stat .n.warn { color: var(--amber); } .stat .n.bad { color: var(--cereja); }
    .stat .l { color: var(--cinza); font-size: 12px; margin-top: 8px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }

    .card { background: var(--card); border: 1px solid var(--linha); border-radius: var(--radius); box-shadow: none; padding: 18px; margin-bottom: 16px; }
    .card h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--cinza); font-weight: 600; }
    .bars .bar { display: grid; grid-template-columns: 130px 1fr 40px; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
    .bars .track { background: var(--creme-2); border-radius: 6px; height: 10px; overflow: hidden; }
    .bars .fill { background: var(--tinta); height: 100%; }
    .bars .v { text-align: right; color: var(--cinza); font-family: var(--monof); font-size: 12px; }

    /* Conversation list */
    .conv { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 12px; background: var(--card); margin-bottom: 8px; cursor: pointer; box-shadow: none; transition: border-color .35s var(--ease); }
    .conv:hover { border-color: var(--tinta); }
    .conv .who { font-weight: 600; }
    .conv .meta { color: var(--cinza); font-size: 12.5px; margin-top: 2px; }
    .conv .right { text-align: right; color: var(--cinza); font-size: 12px; white-space: nowrap; font-family: var(--monof); }
    .pill { display: inline-block; background: var(--creme-2); color: var(--tinta); border-radius: 20px; padding: 1px 9px; font-size: 11.5px; margin-right: 4px; font-weight: 500; }

    /* Prospecção */
    .funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .fstage { position: relative; background: var(--card); border: 1px solid var(--linha); border-radius: var(--radius); box-shadow: none; padding: 12px 14px; cursor: pointer; text-align: left; transition: transform .35s var(--ease), border-color .35s var(--ease); font: inherit; color: inherit; }
    .fstage:hover { transform: translateY(-1px); border-color: var(--tinta); }
    .fstage.on { border-color: var(--tinta); outline: 2px solid var(--cereja); outline-offset: -1px; }
    .fstage .n { font-family: var(--display); font-weight: 900; font-size: 38px; line-height: .9; color: var(--tinta); font-variant-numeric: tabular-nums; }
    .fstage .l { font-size: 11px; color: var(--cinza); text-transform: uppercase; letter-spacing: .12em; margin-top: 6px; font-weight: 600; }
    .fstage .dot { position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%; }
    .fstage .arr { position: absolute; right: -9px; top: 50%; transform: translateY(-50%); color: var(--cinza-claro); font-size: 13px; z-index: 1; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar input[type=text] { flex: 1; min-width: 170px; padding: 9px 12px; }
    .chip { border: 1px solid var(--linha); background: var(--card); color: var(--cinza); border-radius: 999px; padding: 6px 12px; min-height: 32px; font-size: 12.5px; cursor: pointer; transition: background-color .35s var(--ease), color .35s var(--ease); }
    .chip:hover { color: var(--tinta); border-color: var(--tinta); }
    .chip.on { background: var(--tinta); border-color: var(--tinta); color: var(--creme); }
    .spill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 2px 9px; color: #fff; }
    .pcard { border-left: 4px solid transparent; }
    .pcard .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pcard .quali { font-size: 12.5px; color: var(--folha); margin-top: 4px; }
    .pcard .act { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    .btn.tiny { width: auto; min-height: 30px; padding: 0 10px; font-size: 12px; margin: 0; border-radius: 999px; }
    .btn.danger { background: transparent; color: var(--cereja); border: 1px solid var(--linha); }
    .btn.danger:hover { background: #F7DAD6; border-color: var(--cereja); }
    .prospect-thread { animation: slidein .18s var(--ease); }
    @keyframes slidein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    details.imp summary { cursor: pointer; color: var(--tinta); font-weight: 600; font-size: 14px; }
    .countnote { color: var(--cinza); font-size: 13px; margin: 2px 0 12px; }

    /* Thread — balões do site */
    .thread { display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 78%; padding: 10px 13px; border-radius: 16px; font-size: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .msg.in { align-self: flex-start; background: #fff; border: 1px solid var(--linha); border-bottom-left-radius: 5px; }
    .msg.out { align-self: flex-end; background: var(--folha); color: #fff; border-bottom-right-radius: 5px; }
    .msg .tag { display: block; font-size: 10.5px; margin-top: 4px; opacity: .7; font-family: var(--monof); }
    .msg.in .tag { color: var(--cinza); opacity: 1; }
    .backlink { background: none; border: none; color: var(--tinta); padding: 0 0 12px; font-weight: 600; min-height: 44px; }
    .backlink:hover { color: var(--cereja); }

    /* Style packs */
    .pack { border: 1px solid var(--linha); border-radius: 12px; background: var(--card); padding: 14px 16px; margin-bottom: 10px; box-shadow: none; }
    .pack .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .badge.on { background: var(--folha); color: #fff; } .badge.off { background: var(--creme-2); color: var(--cinza); }
    .pack .notes { color: var(--cinza); font-size: 13px; margin: 6px 0 0; }
    .pack pre { background: var(--creme); border: 1px solid var(--linha); border-radius: 10px; padding: 12px; overflow: auto; font-size: 12.5px; max-height: 320px; white-space: pre-wrap; font-family: var(--monof); }

    .digest pre { background: var(--creme); border: 1px solid var(--linha); border-radius: 10px; padding: 14px; white-space: pre-wrap; font-family: inherit; font-size: 13.5px; }
    .digest .when { color: var(--cinza); font-size: 12px; margin-bottom: 6px; font-family: var(--monof); }
    .empty { color: var(--cinza); text-align: center; padding: 40px 0; }
    .loading { color: var(--cinza); padding: 20px 0; }
    .soon { text-align: center; padding: 48px 20px; color: var(--cinza); }
    .soon .serif { font-size: 32px; color: var(--tinta); display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <form class="login-card" id="loginForm">
      <div class="brand"><span class="serif" style="font-size:26px">Stevi</span></div>
      <h1 class="serif">Painel</h1>
      <p>Área dos fundadores · Stefano &amp; Vitoria</p>
      <input type="password" id="pw" placeholder="Senha" autocomplete="current-password" autofocus />
      <button class="btn" type="submit">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <!-- APP -->
  <div id="app">
    <header class="top">
      <div class="brand"><h1 class="serif">Stevi · Painel</h1></div>
      <button class="btn ghost small" id="logout">Sair</button>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Visão geral</button>
      <button class="tab" data-tab="conversas">Conversas</button>
      <button class="tab" data-tab="leads">Leads</button>
      <button class="tab" data-tab="prospeccao">Prospecção</button>
      <button class="tab" data-tab="voz">Voz</button>
      <button class="tab" data-tab="digests">Resumos</button>
      <button class="tab" data-tab="gym">Treino</button>
    </nav>

    <section class="panel active" id="p-overview"><div class="loading">Carregando…</div></section>
    <section class="panel" id="p-conversas"><div class="loading">Carregando…</div></section>
    <section class="panel" id="p-leads"><div class="loading">Carregando…</div></section>
    <section class="panel" id="p-prospeccao"><div class="loading">Carregando…</div></section>
    <section class="panel" id="p-voz"><div class="loading">Carregando…</div></section>
    <section class="panel" id="p-digests"><div class="loading">Carregando…</div></section>
    <section class="panel" id="p-gym"><div class="loading">Carregando…</div></section>
  </div>

  <script>
    const $ = (s, r=document) => r.querySelector(s);
    const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    // Campos fora de `data` (ex.: prospects → dispatch) ficam aqui para quem
    // precisar, sem mudar a assinatura de api().
    let lastMeta = {};
    const api = async (path, opts={}) => {
      const r = await fetch('/api/ops/' + path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
      if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
      const j = await r.json();
      if (!j.success) throw new Error(j.error || 'erro');
      lastMeta = j;
      return j.data;
    };

    /**
     * Frase honesta sobre o estado do disparo — nunca "ativo" quando não está.
     * Linguagem de founder na frente; o dado técnico vai pro title (tooltip).
     * Reescrita em 31/jul: a versão anterior dizia "cap", "breaker", "falhas
     * pós-aceite" — jargão nosso vazando pra tela de quem decide.
     */
    function dispatchLine(d) {
      if (!d || d.error) return '⚠️ Não consegui ver o estado dos convites agora — recarregue a página.';
      const hoje = d.sentToday != null ? ` Hoje já saíram ${d.sentToday}.` : '';
      if (d.latched) return `⛔ Convites suspensos por segurança: o número levou 2 pausas de saúde em 3 semanas. Fale com o suporte técnico (Claude) pra religar.`;
      if (d.breakerTripped) return `⏸️ Pausado por hoje: ${d.failedToday} números seguidos não tinham WhatsApp, então paramos pra proteger a reputação do nosso número. Religa sozinho amanhã.${hoje}`;
      if (d.paused) {
        const por = d.grade === 'manual' ? 'pausa manual que nós ligamos' : 'a saúde do nosso número no WhatsApp pediu uma pausa';
        return `⏸️ Convites pausados (${por}). Nada sai até religar.${hoje}`;
      }
      return `✅ Convites saindo sozinhos: até ${d.cap} por dia útil, às 10h, 13h e 16h.${hoje}`;
    }

    /** Tradução de erro técnico do WhatsApp pra frase de gente. O código cru
     * fica no tooltip pra quem for depurar. */
    function erroHumano(e) {
      const t = String(e || '');
      if (/131026/.test(t)) return '📵 esse número não tem WhatsApp';
      if (/131049|130497/.test(t)) return '🚦 o WhatsApp limitou envios pra essa pessoa por ora';
      if (/131042/.test(t)) return '💳 problema de cobrança na nossa conta Meta';
      if (/132000|132001/.test(t)) return '📋 a mensagem-modelo precisa de ajuste';
      return '⚠️ o envio falhou';
    }

    /** Intenções em linguagem simples (o rótulo técnico fica no tooltip). */
    const INTENT_LABELS = {
      smalltalk: 'papo geral', pest: 'praga ou doença', spray: 'hora de pulverizar',
      price: 'preço do café', weather: 'clima', referral: 'pediu agrônomo',
      onboarding: 'primeiro contato', optout: 'pediu pra sair', other: 'outros assuntos',
    };
    /** Fixo não tem WhatsApp — mesma regra do core.isMobileBR. */
    const isMobile = (phone) => { const d = String(phone||'').replace(/[^0-9]/g,''); return d.length === 13 && d.startsWith('55') && d[4] === '9'; };
    const fmtDate = (s) => { if (!s) return '—'; const d = new Date(s); return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); };

    function showLogin() { $('#app').style.display = 'none'; $('#login').style.display = 'grid'; }
    function showApp() { $('#login').style.display = 'none'; $('#app').style.display = 'block'; loadTab('overview'); }

    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#loginErr').textContent = '';
      try {
        const r = await fetch('/api/ops/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
        const j = await r.json();
        if (j.success) { $('#pw').value=''; showApp(); }
        else $('#loginErr').textContent = j.error || 'senha incorreta';
      } catch { $('#loginErr').textContent = 'erro de conexão'; }
    });
    $('#logout').addEventListener('click', async () => {
      // The cookie is HttpOnly — only the server can expire it.
      try { await fetch('/api/ops/logout', { method: 'POST', credentials: 'same-origin' }); } catch { /* show login anyway; the session still dies at TTL */ }
      showLogin();
    });

    const loaded = {};
    $('#tabs').addEventListener('click', (e) => {
      const b = e.target.closest('.tab'); if (!b) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      $('#p-' + b.dataset.tab).classList.add('active');
      loadTab(b.dataset.tab);
    });

    function activateTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      document.querySelectorAll('.panel').forEach(pp => pp.classList.toggle('active', pp.id === 'p-' + name));
    }

    function loadTab(tab) {
      if (tab === 'overview') return loadOverview();
      if (tab === 'conversas') return loadConversas();
      if (tab === 'leads') return loadLeads();
      if (tab === 'prospeccao') return loadProspeccao();
      if (tab === 'voz') return loadVoz();
      if (tab === 'digests') return loadDigests();
      if (tab === 'gym') return loadGym();
    }

    // "O que fazer hoje" — the work queue for a non-technical founder. Built
    // from the same endpoints the tabs use; each card jumps to the right tab.
    async function todayStrip() {
      const wrap = el('div', 'card');
      wrap.append(el('h3', null, '☀️ O que fazer hoje'));
      const row = el('div', 'funnel');
      wrap.append(row);
      try {
        const [leads, prospects] = await Promise.all([api('leads'), api('prospects')]);
        const newLeads = leads.filter(l => (l.status || 'novo') === 'novo').length;
        const repliedP = prospects.filter(x => x.status === 'replied').length;
        const agentOff = prospects.filter(x => x.status === 'replied' && x.agent_enabled === false).length;
        const queue = prospects.filter(x => x.status === 'ready' && !x.send_status).length; // sending/failed rows aren't queued
        const items = [
          { n: newLeads, l: 'leads pra encaminhar', hint: 'Produtores pedindo agrônomo — entregue ao parceiro e marque "Encaminhado".', tab: 'leads', urgent: newLeads > 0 },
          { n: repliedP, l: 'prospects em conversa', hint: agentOff ? agentOff + ' com agente desligado — responda você!' : 'A Vitória 🤖 cuida; entre só se ela escalar.', tab: 'prospeccao', urgent: agentOff > 0 },
          { n: queue, l: 'esperando convite', hint: 'Empresas aprovadas que vão receber o primeiro contato sozinhas, em dia útil. Fila baixa? Busque mais na aba Prospecção.', tab: 'prospeccao', urgent: queue < 8 },
        ];
        for (const it of items) {
          const b = el('button', 'fstage');
          const n = el('div', 'n', String(it.n));
          if (it.urgent) n.style.color = 'var(--amber)';
          b.append(n, el('div', 'l', it.l));
          b.title = it.hint;
          b.addEventListener('click', () => { activateTab(it.tab); loadTab(it.tab); });
          row.append(b);
        }
        wrap.append(el('div', 'countnote', newLeads === 0 && agentOff === 0 ? '✅ Nada urgente — a operação está rodando sozinha.' : '⚠️ Tem coisa esperando você — clique no card laranja.'));
      } catch { row.append(el('div', 'empty', '—')); }
      return wrap;
    }

    async function loadOverview() {
      const p = $('#p-overview');
      try {
        const d = await api('overview');
        p.innerHTML = '';
        p.append(await todayStrip());
        const stats = el('div', 'stats');
        // Cada número com a explicação no tooltip — um card que precisa de
        // tradutor não informa, assusta.
        const cards = [
          ['Produtores', d.users, '', 'Cafeicultores que já falaram com a Stevi no WhatsApp'],
          ['Novos na semana', d.newUsers7d, '', 'Produtores que chegaram nos últimos 7 dias'],
          ['Msgs recebidas', d.inbound, '', 'Tudo que produtores já mandaram pra Stevi'],
          ['Msgs enviadas', d.outbound, '', 'Tudo que a Stevi já respondeu'],
          ['Recebidas na semana', d.inbound7d, '', 'Movimento dos últimos 7 dias'],
          ['Pedidos de agrônomo', d.referrals, '', 'Produtores que pediram atendimento técnico — são os leads que a gente entrega aos parceiros'],
          ['Problemas na semana', d.failures7d, d.failures7d>0?'warn':'', 'Mensagens que a Stevi não conseguiu responder por erro nosso. Zero é o normal'],
          ['Jeito de escrever', d.activePack!=null?('v'+d.activePack):'—', '', 'Versão ativa do estilo de escrita da Stevi (aba Voz)'],
        ];
        for (const [l, n, cls, tip] of cards) {
          const c = el('div', 'stat');
          c.title = tip || '';
          c.append(el('div', 'n ' + (cls||''), String(n)), el('div', 'l', l));
          stats.append(c);
        }
        p.append(stats);
        const intents = Object.entries(d.byIntent||{}).sort((a,b)=>b[1]-a[1]);
        const card = el('div', 'card'); card.append(el('h3', null, 'Sobre o que os produtores falaram (7 dias)'));
        if (!intents.length) card.append(el('div', 'empty', 'Sem conversas nos últimos 7 dias.'));
        else {
          const max = intents[0][1]; const bars = el('div', 'bars');
          for (const [k, v] of intents) {
            const row = el('div', 'bar'); const track = el('div', 'track'); const fill = el('div', 'fill');
            fill.style.width = Math.round(v/max*100) + '%'; track.append(fill);
            const nome = el('span', 'mono', INTENT_LABELS[k] || k);
            nome.title = 'código interno: ' + k;
            row.append(nome, track, el('span', 'v', String(v))); bars.append(row);
          }
          card.append(bars);
        }
        p.append(card);
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }

    async function loadConversas() {
      const p = $('#p-conversas'); p.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        const rows = await api('conversations');
        p.innerHTML = '';
        p.append(el('div', 'countnote', 'Produtores conversando com a Stevi no WhatsApp. Clique num card pra ler a conversa inteira.'));
        if (!rows.length) { p.innerHTML = '<div class="empty">Nenhuma conversa ainda.</div>'; return; }
        for (const c of rows) {
          const item = el('div', 'conv');
          const left = el('div');
          left.append(el('div', 'who', (c.name ? c.name + ' · ' : '') + c.phone));
          const meta = el('div', 'meta');
          if (c.uf) meta.append(Object.assign(el('span','pill'), {textContent: c.uf}));
          (c.crop||[]).forEach(cr => meta.append(Object.assign(el('span','pill'), {textContent: cr})));
          meta.append(document.createTextNode(c.messages + ' msgs'));
          left.append(meta);
          const right = el('div', 'right', fmtDate(c.lastAt));
          item.append(left, right);
          item.addEventListener('click', () => openThread(c));
          p.append(item);
        }
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }

    async function openThread(c) {
      const p = $('#p-conversas'); p.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        const msgs = await api('conversations?userId=' + encodeURIComponent(c.userId));
        p.innerHTML = '';
        const back = el('button', 'backlink', '← Voltar'); back.addEventListener('click', loadConversas); p.append(back);
        p.append(el('h3', null, (c.name ? c.name + ' · ' : '') + c.phone));
        const thread = el('div', 'thread');
        for (const m of msgs) {
          const b = el('div', 'msg ' + (m.direction === 'in' ? 'in' : 'out'), m.text || '('+m.kind+')');
          b.append(el('span', 'tag', [m.kind, m.intent, fmtDate(m.at)].filter(Boolean).join(' · ')));
          thread.append(b);
        }
        p.append(thread);
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }

    // ── Leads (pedidos de agrônomo) ────────────────────────────────────────
    const L_STATUS = {
      novo:      { label: 'Novos', pill: 'novo', color: '#b7791f', hint: 'produtor pediu agrônomo — encaminhar pro parceiro' },
      contatado: { label: 'Encaminhados', pill: 'encaminhado', color: '#3b6fb2', hint: 'lead entregue ao parceiro — aguardando fechamento' },
      fechado:   { label: 'Fechados', pill: 'fechado', color: '#2e9e63', hint: 'atendido pelo parceiro 🎉' },
    };
    const lState = { status: null };
    let lCache = [];

    async function loadLeads() {
      const p = $('#p-leads'); p.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        lCache = await api('leads');
        p.innerHTML = '';
        const funnel = el('div', 'funnel'); funnel.id = 'l-funnel';
        p.append(funnel);
        p.append(el('div', 'countnote', 'Cada lead é um produtor que pediu receituário/agrônomo. Clique no card pra abrir a conversa completa dele.'));
        const listWrap = el('div'); listWrap.id = 'lead-list';
        p.append(listWrap);
        renderLeads();
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }

    function renderLeads() {
      const funnel = $('#l-funnel'); if (!funnel) return;
      funnel.innerHTML = '';
      const stages = Object.keys(L_STATUS);
      stages.forEach((s, i) => {
        const st = L_STATUS[s];
        const n = lCache.filter(x => (x.status || 'novo') === s).length;
        const b = el('button', 'fstage' + (lState.status === s ? ' on' : ''));
        b.title = st.hint;
        b.append(el('div', 'n', String(n)), el('div', 'l', st.label));
        const dot = el('span', 'dot'); dot.style.background = st.color; b.append(dot);
        if (i < stages.length - 1) b.append(el('span', 'arr', '›'));
        b.addEventListener('click', () => { lState.status = lState.status === s ? null : s; renderLeads(); });
        funnel.append(b);
      });

      const wrap = $('#lead-list'); if (!wrap) return;
      wrap.innerHTML = '';
      const order = { novo: 0, contatado: 1, fechado: 2 };
      let rows = [...lCache].sort((a, b) =>
        (order[a.status || 'novo'] ?? 9) - (order[b.status || 'novo'] ?? 9) ||
        String(b.at || '').localeCompare(String(a.at || '')));
      if (lState.status) rows = rows.filter(x => (x.status || 'novo') === lState.status);
      if (!rows.length) {
        wrap.append(el('div', 'empty', lCache.length ? 'Nada aqui com esse filtro.' : 'Nenhum pedido de agrônomo ainda — eles aparecem aqui na hora.'));
        return;
      }
      for (const l of rows) wrap.append(leadRow(l));
    }

    function leadRow(l) {
      const s = l.status || 'novo';
      const st = L_STATUS[s] || L_STATUS.novo;
      const item = el('div', 'conv pcard');
      item.style.borderLeftColor = st.color;

      const left = el('div');
      const who = el('div', 'who');
      who.append(el('span', null, l.phone));
      const spill = el('span', 'spill', st.pill); spill.style.background = st.color;
      who.append(spill);
      left.append(who);
      const meta = el('div', 'meta');
      if (l.uf) meta.append(Object.assign(el('span','pill'), {textContent: l.uf}));
      (l.crop||[]).forEach(cr => meta.append(Object.assign(el('span','pill'), {textContent: cr})));
      meta.append(document.createTextNode(fmtDate(l.at)));
      left.append(meta);
      if (l.topic) left.append(el('div', 'quali', '“' + l.topic + '”'));

      const right = el('div', 'act');
      const setStatus = async (status, btn) => {
        btn.disabled = true;
        try {
          await api('leads', { method: 'POST', body: JSON.stringify({ id: l.id, status }) });
          l.status = status; renderLeads();
        } catch (e) { if (e.message!=='unauthorized') alert('Não deu pra salvar o status.'); btn.disabled = false; }
      };
      if (s === 'novo') {
        const fwd = el('button', 'btn tiny', '→ Encaminhado');
        fwd.title = 'Marquei que entreguei esse lead a um parceiro';
        fwd.addEventListener('click', (e) => { e.stopPropagation(); setStatus('contatado', fwd); });
        right.append(fwd);
      } else if (s === 'contatado') {
        const done = el('button', 'btn tiny', '✓ Fechado');
        done.addEventListener('click', (e) => { e.stopPropagation(); setStatus('fechado', done); });
        const back = el('button', 'btn tiny ghost', '↩');
        back.title = 'Voltar pra novo';
        back.addEventListener('click', (e) => { e.stopPropagation(); setStatus('novo', back); });
        right.append(done, back);
      } else {
        const back = el('button', 'btn tiny ghost', '↩ Reabrir');
        back.addEventListener('click', (e) => { e.stopPropagation(); setStatus('contatado', back); });
        right.append(back);
      }

      item.append(left, right);
      if (l.userId) {
        item.style.cursor = 'pointer';
        item.addEventListener('click', () => { activateTab('conversas'); openThread({ userId: l.userId, phone: l.phone, name: null }); });
      }
      return item;
    }

    // ── Prospecção ──────────────────────────────────────────────────────────
    // Status model: discovered → ready → contacted → replied (+ discarded).
    const P_STATUS = {
      discovered: { label: 'Descobertos', pill: 'descoberto', color: '#b7791f', hint: 'achados na web ou importados — revise e aprove' },
      ready:      { label: 'Aprovados', pill: 'aprovado', color: '#2e9e63', hint: 'na fila do disparo automático (seg–sex 10h/13h/16h)' },
      contacted:  { label: 'Contatados', pill: 'contatado', color: '#3b6fb2', hint: 'template enviado — aguardando resposta' },
      replied:    { label: 'Responderam', pill: 'respondeu', color: '#14432f', hint: 'em conversa com a Vitória 🤖 — promova quando fechar' },
      partner:    { label: 'Parceiros', pill: 'parceiro', color: '#7c5cbf', hint: 'ativos — recebem leads consentidos de produtores da região' },
      stale:      { label: 'Esfriaram', pill: 'esfriou', color: '#8a7a5c', hint: 'sem resposta após o follow-up — reative ou deixe' },
      discarded:  { label: 'Descartados', pill: 'descartado', color: '#9aa5a0', hint: 'fora do perfil' },
    };
    const pState = { status: null, kind: null, q: '' };
    let pCache = [];

    // Effective stage: send_status 'sent' shows as contacted even if the row
    // status hasn't caught up yet.
    const pStage = (pr) => (pr.status === 'ready' && ['sent','delivered','read'].includes(pr.send_status)) ? 'contacted' : pr.status;

    async function loadProspeccao() {
      const p = $('#p-prospeccao'); p.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        pCache = await api('prospects');
        p.innerHTML = '';

        // Funnel — clickable stages that filter the list below.
        const funnel = el('div', 'funnel'); funnel.id = 'p-funnel';
        p.append(funnel);

        // Toolbar: search + kind chips + actions.
        const bar = el('div', 'toolbar');
        const q = el('input'); q.type = 'text'; q.placeholder = '🔎 Buscar por nome, cidade…';
        q.addEventListener('input', () => { pState.q = q.value.trim().toLowerCase(); renderProspects(); });
        bar.append(q);
        for (const k of ['consultoria', 'revenda', 'cooperativa', 'agronomo', 'fazenda']) {
          const c = el('button', 'chip', k);
          c.addEventListener('click', () => {
            pState.kind = pState.kind === k ? null : k;
            bar.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.textContent === pState.kind));
            renderProspects();
          });
          bar.append(c);
        }
        p.append(bar);

        // Actions row: sourcing + dispatch (the cron does this alone on weekdays;
        // these buttons exist for "now" moments).
        const act = el('div', 'toolbar');
        const srcBtn = el('button', 'btn small ghost', '🌐 Buscar na web');
        srcBtn.addEventListener('click', async () => {
          srcBtn.disabled = true; srcBtn.textContent = 'Buscando…';
          try {
            const rep = await api('prospects', { method:'POST', body: JSON.stringify({ action:'source' }) });
            note.textContent = rep.configured
              ? `Busca: ${rep.found} encontrados · ${rep.imported} novos importados (${rep.withPhone} com telefone` +
                (rep.enriquecidos ? `, ${rep.enriquecidos} com zap confirmado no site 📱` : '') + `).` +
                (rep.error ? ` Aviso: ${rep.error}` : '')
              : rep.error;
            const msg = note.textContent;
            await refreshProspects();
            // refreshProspects escreve a linha do motor por cima — devolve o
            // resultado da busca, que e o que a pessoa clicou pra ver.
            note.textContent = msg;
          } catch (e) { if (e.message!=='unauthorized') note.textContent = 'Erro na busca: '+e.message; }
          finally { srcBtn.disabled = false; srcBtn.textContent = '🌐 Buscar na web'; }
        });
        const enrBtn = el('button', 'btn small ghost', '📱 Procurar WhatsApp da fila');
        enrBtn.title = 'Pra quem só temos telefone fixo: procuramos o site da empresa e, se ela publica um link de WhatsApp, passamos a usar esse número. Mensagem pra número citado é ~7× mais lida.';
        enrBtn.addEventListener('click', async () => {
          enrBtn.disabled = true; enrBtn.textContent = 'Procurando…';
          try {
            const rep = await api('prospects', { method:'POST', body: JSON.stringify({ action:'enrich' }) });
            const msg = !rep.configurado ? rep.error
              : rep.candidatos === 0 ? 'Ninguém precisando: todo mundo na fila já tem celular ou WhatsApp confirmado.'
              : `Procurei em ${rep.candidatos} empresas: ${rep.enriquecidos} agora têm WhatsApp confirmado 📱` +
                (rep.enriquecidos ? ` (${rep.exemplos.join(', ')})` : '') +
                (rep.candidatos >= 15 ? ' · tem mais na fila — clique de novo pra continuar' : '');
            await refreshProspects();
            note.textContent = msg;
          } catch (e) { if (e.message!=='unauthorized') note.textContent = 'Erro na procura: '+e.message; }
          finally { enrBtn.disabled = false; enrBtn.textContent = '📱 Procurar WhatsApp da fila'; }
        });
        const simBtn = el('button', 'btn small ghost', '👁 Ver quem sai no próximo lote');
        const goBtn = el('button', 'btn small', '📤 Enviar convites agora');
        const runDispatch = async (dryRun) => {
          if (!dryRun && !confirm('Enviar o template de parceria pro próximo lote de aprovados agora? (respeita opt-out, 20/dia e horário comercial)')) return;
          note.textContent = 'Processando…';
          try {
            const rep = await api('prospects', { method:'POST', body: JSON.stringify({ action:'dispatch', dryRun }) });
            if (rep.skippedOutsideHours) note.textContent = 'Fora do horário comercial (seg–sex 9–18 BRT) — nenhum envio.';
            else if (rep.aborted) note.textContent = '⛔ Abortado por segurança: ' + (rep.error||'');
            else if (dryRun) note.textContent = `Próximo lote (${rep.planned} de ${rep.eligible} elegíveis): ` + (rep.recipients.map(r=>r.name).join(', ') || 'ninguém');
            else note.textContent = `Enviados: ${rep.sent} · falhas: ${rep.failed} · na fila: ${rep.eligible - rep.sent}` + (rep.capGrade ? ` · cap hoje: ${rep.cap} (${rep.capGrade})` : '');
            if (!dryRun) await refreshProspects();
          } catch (e) { if (e.message!=='unauthorized') note.textContent = 'Erro: '+e.message; }
        };
        simBtn.addEventListener('click', () => runDispatch(true));
        goBtn.addEventListener('click', () => runDispatch(false));
        act.append(srcBtn, enrBtn, simBtn, goBtn);
        p.append(act);
        // Estado REAL do motor (vem de /api/ops/prospects → dispatch). O texto
        // fixo que existia aqui dizia "ativo" mesmo com a parada de emergência
        // ligada — os founders liam "ativo" enquanto nada saía.
        const note = el('div', 'countnote', dispatchLine(lastMeta.dispatch));
        note.id = 'p-dispatch-state';
        p.append(note);

        // Manual import, tucked away — sourcing is the primary intake now.
        const det = el('details', 'imp');
        det.append(Object.assign(el('summary'), { textContent: '📋 Importar lista manualmente' }));
        const impBox = el('div', 'card'); impBox.style.marginTop = '10px';
        impBox.append(el('div', 'countnote', 'Uma linha por prospect: nome, telefone, cidade, uf, tipo — ex.: "Cooperativa Central, (19) 3822-1234, Campinas, SP, coop".'));
        const ta = el('textarea'); ta.rows = 4;
        ta.style.cssText = 'width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit';
        const impBtn = el('button', 'btn small', 'Importar');
        impBtn.style.marginTop = '8px';
        impBtn.addEventListener('click', async () => {
          if (!ta.value.trim()) return;
          impBtn.disabled = true;
          try {
            const r = await api('prospects', { method:'POST', body: JSON.stringify({ action:'import', text: ta.value }) });
            note.textContent = `Importados: ${r.inserted} novos · ${r.parsed} lidos · ${r.invalid} com telefone inválido.`;
            ta.value = ''; await refreshProspects();
          } catch (e) { if (e.message!=='unauthorized') note.textContent = 'Erro ao importar: '+e.message; }
          finally { impBtn.disabled = false; }
        });
        impBox.append(ta, impBtn);
        det.append(impBox);
        const detWrap = el('div'); detWrap.style.marginBottom = '14px'; detWrap.append(det);
        p.append(detWrap);

        const listWrap = el('div'); listWrap.id = 'prospect-list';
        p.append(listWrap);
        renderProspects();
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }

    async function refreshProspects() {
      try {
        pCache = await api('prospects');
        const n = document.querySelector('#p-dispatch-state');
        if (n) n.textContent = dispatchLine(lastMeta.dispatch);
        renderProspects();
      } catch {}
    }

    function renderFunnel() {
      const funnel = $('#p-funnel'); if (!funnel) return;
      funnel.innerHTML = '';
      // Conversões CUMULATIVAS (quem passou pelo estágio), calculadas no
      // servidor — ver funnel.ts. Os cards abaixo contam quem está em cada
      // estágio AGORA; as taxas respondem "a máquina converte?".
      const f = lastMeta.funnel;
      if (f && f.contatados > 0) {
        // Frase inteira, não sopa de percentuais: quem lê decide, não calcula.
        let frase = `📈 De ${f.contatados} empresas contatadas, ${f.responderam} responderam`;
        if (f.taxaResposta != null) frase += ` (${f.taxaResposta}%)`;
        if (f.responderam > 0) frase += ` · ${f.parceiros} viraram parceiras`;
        const tipos = (f.porTipo || []).slice(0, 3).map(k => `${k.kind} ${k.taxaResposta ?? 0}%`).join(', ');
        const note = el('div', 'countnote', frase + '.');
        if (tipos) note.title = 'Resposta por tipo de empresa: ' + tipos;
        funnel.append(note);
      }
      const stages = Object.keys(P_STATUS);
      stages.forEach((s, i) => {
        const st = P_STATUS[s];
        const n = pCache.filter(x => pStage(x) === s).length;
        const b = el('button', 'fstage' + (pState.status === s ? ' on' : ''));
        b.title = st.hint;
        b.append(el('div', 'n', String(n)), el('div', 'l', st.label));
        const dot = el('span', 'dot'); dot.style.background = st.color; b.append(dot);
        if (i < stages.indexOf('partner')) b.append(el('span', 'arr', '›')); // arrows only along the happy path (…→ parceiro)
        b.addEventListener('click', () => { pState.status = pState.status === s ? null : s; renderProspects(); });
        funnel.append(b);
      });
    }

    function renderProspects() {
      renderFunnel();
      const wrap = $('#prospect-list'); if (!wrap) return;
      wrap.innerHTML = '';

      const order = { replied: 0, contacted: 1, partner: 2, ready: 3, discovered: 4, stale: 5, discarded: 6 };
      // Dentro do estágio, melhor número primeiro: 📱 confirmado > celular >
      // fixo. É a ordem da revisão — aprovar os que mais têm chance de serem
      // lidos antes de gastar atenção nos fixos.
      const qualidade = (x) => (x.wa_phone_source && x.wa_phone) ? 0 : isMobile(x.phone) ? 1 : 2;
      let rows = [...pCache].sort((a, b) =>
        (order[pStage(a)] ?? 9) - (order[pStage(b)] ?? 9) ||
        qualidade(a) - qualidade(b) ||
        String(b.updated_at || '').localeCompare(String(a.updated_at || '')));
      if (pState.status) rows = rows.filter(x => pStage(x) === pState.status);
      if (pState.kind) rows = rows.filter(x => (x.kind || '') === pState.kind);
      if (pState.q) rows = rows.filter(x => (x.name + ' ' + (x.city||'') + ' ' + (x.phone||'')).toLowerCase().includes(pState.q));

      wrap.append(el('div', 'countnote',
        rows.length === pCache.length ? `${rows.length} prospects` : `${rows.length} de ${pCache.length} prospects (filtro ativo)`));
      if (!rows.length) { wrap.append(el('div', 'empty', 'Nada aqui com esse filtro.')); return; }

      for (const pr of rows) wrap.append(prospectRow(pr));
    }

    function prospectRow(pr) {
      const stage = pStage(pr);
      const st = P_STATUS[stage] || P_STATUS.discovered;
      const item = el('div', 'conv pcard');
      item.style.borderLeftColor = st.color;

      const left = el('div');
      const who = el('div', 'who');
      who.append(el('span', null, pr.name));
      const spill = el('span', 'spill', st.pill); spill.style.background = st.color;
      who.append(spill);
      if (pr.agent_enabled === false) {
        const off = el('span', 'spill', '🤖 agente off'); off.style.background = 'var(--amber)'; who.append(off);
      }
      left.append(who);
      const meta = el('div', 'meta');
      [pr.kind, pr.city, pr.uf].filter(Boolean).forEach(v => meta.append(Object.assign(el('span','pill'),{textContent:v})));
      // Mostra o número para o qual REALMENTE mandaríamos — igual ao
      // core.sendablePhone: o confirmado com fonte ganha do telefone do Places.
      const enviavel = (pr.wa_phone_source && pr.wa_phone) ? pr.wa_phone : pr.phone;
      meta.append(document.createTextNode(enviavel || '(sem número)'));
      if (pr.wa_status === 'invalid') meta.append(Object.assign(el('span','pill'),{textContent:'nº inválido'}));
      if (pr.wa_phone_source && pr.wa_phone) {
        const achouOutro = pr.wa_phone !== pr.phone;
        const pill = Object.assign(el('span','pill'), {
          textContent: achouOutro ? '📱 número achado' : '✅ zap confirmado',
        });
        pill.style.background = 'var(--green)';
        pill.title = (achouOutro ? 'Places: ' + (pr.phone || '—') + ' · ' : '') + 'fonte: ' + pr.wa_phone_source;
        meta.append(pill);
      } else if (!isMobile(pr.phone)) {
        // Fixo sem confirmação ainda entrega (9 das nossas 14 entregas foram
        // pra fixo), mas é onde vale procurar um número melhor.
        const pill = Object.assign(el('span','pill'), { textContent: '☎️ só temos o fixo' });
        pill.title = 'Fixo recebe menos: quase ninguém le. Se acharem no site/Instagram um celular ou link de WhatsApp, vale editar — mensagens pra numero citado sao ~7x mais lidas.';
        meta.append(pill);
      }
      // 131026 é o único erro que condena o número: a Meta disse que não
      // alcança. Mas condena AQUELE número — se o enriquecimento achou outro,
      // o prospect voltou à fila e dizer "não alcançável" seria mentira.
      if (/\b131026\b/.test(String(pr.wa_error || '')) && enviavel === pr.phone) {
        const pill = Object.assign(el('span','pill'), { textContent: '📵 sem WhatsApp' });
        pill.title = 'O WhatsApp confirmou que este número não recebe mensagens (erro 131026). Só volta à fila se acharmos outro número da empresa.';
        meta.append(pill);
      }
      if (pr.send_status === 'failed') {
        // Frase de gente na pill; o erro CRU da Meta fica no tooltip — sem ele
        // o post-mortem de 21/jul virou arqueologia (16 falhas, nenhuma causa).
        const pill = Object.assign(el('span','pill'), { textContent: erroHumano(pr.wa_error) });
        pill.style.background = 'var(--amber)';
        pill.title = 'Erro técnico da Meta: ' + (pr.wa_error || 'não registrado');
        meta.append(pill);
      }
      if (pr.send_status === 'sending') meta.append(Object.assign(el('span','pill'),{textContent:'⏳ envio travou no meio — use Liberar reenvio'}));
      if (pr.send_status === 'delivered') meta.append(Object.assign(el('span','pill'),{textContent:'📬 entregue'}));
      if (pr.send_status === 'read') meta.append(Object.assign(el('span','pill'),{textContent:'👁 lido'}));
      left.append(meta);
      if (pr.qualification && Object.values(pr.qualification).some(v => v != null)) {
        const qd = pr.qualification, bits = [];
        if (qd.accepts_leads != null) bits.push(qd.accepts_leads ? '✅ aceita leads' : '❌ não aceita leads');
        if (qd.response_time) bits.push('⏱ ' + qd.response_time);
        if (qd.format_pref) bits.push('💰 ' + qd.format_pref);
        if (qd.coverage && qd.coverage.length) bits.push('📍 ' + qd.coverage.join(', '));
        if (qd.crops && qd.crops.length) bits.push('🌱 ' + qd.crops.join(', '));
        if (bits.length) left.append(el('div', 'quali', bits.join(' · ')));
      }

      const right = el('div', 'act');
      const setStatus = async (status, btn) => {
        btn.disabled = true;
        try {
          await api('prospects', { method:'POST', body: JSON.stringify({ action:'status', id: pr.id, status }) });
          pr.status = status;
          if (status === 'ready' && pr.wa_status === 'pending') pr.wa_status = 'valid';
          renderProspects();
        } catch (e) { if (e.message!=='unauthorized') alert('Não deu pra salvar.'); btn.disabled = false; }
      };
      if (stage === 'discovered') {
        const ok = el('button', 'btn tiny', '✓ Aprovar');
        if (!pr.phone || pr.wa_status === 'invalid') { ok.disabled = true; ok.title = 'Sem número válido'; }
        ok.addEventListener('click', () => setStatus('ready', ok));
        const no = el('button', 'btn tiny danger', '✕');
        no.title = 'Descartar';
        no.addEventListener('click', () => setStatus('discarded', no));
        right.append(ok, no);
      } else if (stage === 'ready') {
        const back = el('button', 'btn tiny danger', '✕ Tirar da fila');
        back.addEventListener('click', () => setStatus('discovered', back));
        right.append(back);
      } else if (stage === 'discarded' || stage === 'stale') {
        const back = el('button', 'btn tiny danger', '↩ Reativar');
        back.title = 'Volta pra revisão e zera o histórico de envio — aprovado depois, pode receber NOVO disparo';
        back.addEventListener('click', async () => {
          if (!confirm(`Reativar ${pr.name}? O histórico de envio é zerado — depois de aprovado, ele pode receber um novo disparo.`)) return;
          back.disabled = true;
          try {
            await api('prospects', { method:'POST', body: JSON.stringify({ action:'reactivate', id: pr.id }) });
            await refreshProspects();
          } catch (e) { if (e.message!=='unauthorized') alert('Não deu pra reativar.'); back.disabled = false; }
        });
        right.append(back);
      } else if (stage === 'replied') {
        const promote = el('button', 'btn tiny', '🤝 Promover a parceiro');
        promote.title = 'Cria o parceiro ativo (passa a receber leads consentidos) e encerra a prospecção deste contato';
        promote.addEventListener('click', async () => {
          if (!confirm(`Promover ${pr.name} a parceiro ativo? Ele passa a receber leads de produtores da região.`)) return;
          promote.disabled = true;
          try {
            const d = await api('prospects', { method:'POST', body: JSON.stringify({ action:'promote', id: pr.id }) });
            if (d && d.geocoded === false) alert('Parceiro criado, mas não achei as coordenadas da cidade — o match geográfico fica inativo até definir lat/lon (promover de novo tenta outra vez).');
            await refreshProspects();
          } catch (e) { if (e.message!=='unauthorized') alert('Não deu pra promover: ' + e.message); promote.disabled = false; }
        });
        right.append(promote);
      }
      if (pr.send_status === 'failed' || pr.send_status === 'sending') {
        const rst = el('button', 'btn tiny', '↩ Liberar reenvio');
        rst.title = 'Zera o envio travado/falho — o prospect volta pra fila do disparo';
        rst.addEventListener('click', async () => {
          rst.disabled = true;
          try {
            await api('prospects', { method:'POST', body: JSON.stringify({ action:'resetSend', id: pr.id }) });
            await refreshProspects();
          } catch (e) { if (e.message!=='unauthorized') alert('Não deu pra liberar.'); rst.disabled = false; }
        });
        right.append(rst);
      }
      if (stage === 'replied' || stage === 'contacted' || pr.send_status) {
        const chatBtn = el('button', 'btn tiny' + (stage === 'replied' ? '' : ' ghost'), '💬 Conversa');
        chatBtn.addEventListener('click', () => toggleProspectThread(item, pr));
        right.append(chatBtn);
      }

      item.append(left, right);
      return item;
    }

    async function toggleProspectThread(item, pr) {
      let box = item.nextElementSibling;
      if (box && box.classList.contains('prospect-thread')) { box.remove(); return; }
      box = el('div', 'card prospect-thread');
      box.style.cssText = 'margin:4px 0 12px 20px;padding:14px';
      box.append(el('div', 'loading', 'Carregando conversa…'));
      item.after(box);
      try {
        const thread = await api('prospects', { method:'POST', body: JSON.stringify({ action:'thread', id: pr.id }) });
        box.innerHTML = '';
        const hd = el('div', 'toolbar');
        hd.append(el('b', null, 'Vitória 🤖 ↔ ' + pr.name));
        const tg = el('button', 'btn tiny ghost', pr.agent_enabled === false ? '▶️ Religar agente' : '⏸ Assumir conversa');
        tg.addEventListener('click', async () => {
          const enable = pr.agent_enabled === false;
          try {
            await api('prospects', { method:'POST', body: JSON.stringify({ action:'agent', id: pr.id, enabled: enable }) });
            pr.agent_enabled = enable;
            tg.textContent = enable ? '⏸ Assumir conversa' : '▶️ Religar agente';
            renderFunnel();
          } catch (e) { if (e.message!=='unauthorized') alert('Não deu pra salvar.'); }
        });
        hd.append(tg);
        box.append(hd);
        const tw = el('div', 'thread');
        if (!thread.length) box.append(el('div','empty','Sem mensagens ainda — o primeiro contato foi o template aprovado.'));
        else {
          for (const m of thread) {
            const b = el('div', 'msg ' + (m.direction === 'out' ? 'out' : 'in'), m.text ?? '('+m.kind+')');
            b.append(el('span', 'tag', [m.kind !== 'text' ? m.kind : null, m.direction === 'out' ? 'Vitória' : pr.name, fmtDate(m.created_at)].filter(Boolean).join(' · ')));
            tw.append(b);
          }
          box.append(tw);
        }

        // Caixa de resposta manual (05/ago). Nasceu do caso da RT da Pró Solo:
        // uma humana esperando e nenhum caminho para responder fora do agente —
        // a primeira resposta dela acabou saindo por curl. Envia texto LIVRE
        // pelo número da Stevi (ação `reply`), que só funciona na janela de 24h
        // aberta pela última mensagem do prospect; fora dela a Meta recusa
        // (131047) e o erro aparece aqui em português, sem fingir que foi.
        const podeResponder = !!(pr.wa_phone_source && pr.wa_phone);
        const rb = el('div');
        rb.style.cssText = 'display:flex;gap:8px;margin-top:10px;align-items:flex-end';
        const ta = document.createElement('textarea');
        ta.rows = 2; ta.placeholder = podeResponder
          ? 'Responder como a Stevi (vale dentro de 24h da última mensagem dele)…'
          : 'Sem número com fonte citada — este prospect não é respondível.';
        ta.style.cssText = 'flex:1;resize:vertical;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line, #ccc)';
        ta.disabled = !podeResponder;
        const sd = el('button', 'btn tiny', '📤 Enviar');
        sd.disabled = !podeResponder;
        if (!podeResponder) sd.title = 'Mesma régua do disparo: número sem fonte citada não recebe mensagem.';
        sd.addEventListener('click', async () => {
          const texto = ta.value.trim();
          if (!texto) return;
          sd.disabled = true; sd.textContent = '…';
          try {
            await api('prospects', { method:'POST', body: JSON.stringify({ action:'reply', id: pr.id, text: texto }) });
            const b2 = el('div', 'msg out', texto);
            b2.append(el('span', 'tag', 'você · agora'));
            tw.append(b2);
            if (!tw.parentElement) box.append(tw); // thread estava vazia até agora
            ta.value = '';
          } catch (e) {
            if (e.message !== 'unauthorized') {
              alert(/131047/.test(e.message)
                ? 'A janela de 24h fechou — fora dela só template. A mensagem NÃO foi enviada.'
                : 'Não foi: ' + e.message);
            }
          } finally { sd.disabled = false; sd.textContent = '📤 Enviar'; }
        });
        rb.append(ta, sd);
        box.append(rb);
      } catch (e) {
        if (e.message!=='unauthorized') box.innerHTML = '<div class="empty">Erro: '+e.message+'</div>';
      }
    }

    async function loadVoz() {
      const p = $('#p-voz'); p.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        const packs = await api('voice?body=1');
        p.innerHTML = '';
        p.append(el('p', 'meta', 'A voz da Stevi é uma camada versionada, trocável sem deploy. Ativar aplica em ~3 min.'));
        if (!packs.length) { p.append(el('div', 'empty', 'Nenhum style pack ainda.')); return; }
        for (const pk of packs) {
          const card = el('div', 'pack');
          const hd = el('div', 'hd');
          const left = el('div');
          left.append(Object.assign(el('span'), {innerHTML: '<b class="serif" style="font-size:20px;color:var(--green)">v'+pk.version+'</b> <span class="badge '+(pk.active?'on':'off')+'">'+(pk.active?'ATIVA':'inativa')+'</span> <span class="meta">'+pk.chars+' caracteres · '+fmtDate(pk.createdAt)+'</span>'}));
          hd.append(left);
          if (!pk.active) { const b = el('button','btn small','Ativar'); b.addEventListener('click', ()=>activate(pk.version)); hd.append(b); }
          card.append(hd);
          if (pk.notes) card.append(el('p','notes', pk.notes));
          if (pk.body) { const det = el('details'); det.append(Object.assign(el('summary'),{textContent:'Ver conteúdo'})); const pre = el('pre'); pre.textContent = pk.body; det.append(pre); card.append(det); }
          p.append(card);
        }
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }
    async function activate(version) {
      if (!confirm('Ativar a voz v'+version+' em produção?')) return;
      try { await api('voice', { method:'POST', body: JSON.stringify({version}) }); loadVoz(); }
      catch (e) { alert('Erro: '+e.message); }
    }

    async function loadDigests() {
      const p = $('#p-digests'); p.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        const rows = await api('digests');
        p.innerHTML = '';
        p.append(el('div', 'countnote', 'Resumo automático do dia (gerado às 18h BRT): quem chegou, o que perguntaram, onde a Stevi travou.'));
        if (!rows.length) { p.innerHTML = '<div class="empty">Nenhum resumo diário ainda.</div>'; return; }
        for (const d of rows) {
          const card = el('div', 'card digest');
          card.append(el('div', 'when', fmtDate(d.ranAt)));
          const pre = el('pre'); pre.textContent = d.text || '(sem texto)'; card.append(pre);
          p.append(card);
        }
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }

    function scoreChip(label, v) {
      const s = el('span', 'spill', label + ' ' + (v ?? '—') + '/5');
      s.style.background = v >= 4 ? '#2e9e63' : v >= 3 ? '#b7791f' : '#b23b3b';
      return s;
    }

    function renderVitoriaGym(p, vit) {
      const intro = el('div', 'card');
      intro.append(el('h3', null, '🤖 Treino da Vitória (prospecção)'));
      intro.append(el('div', 'countnote',
        'Antes de falar com gente de verdade, a Vitória treina contra clientes simulados — o gerente ocupado, o cético do preço, o que detesta robô. ' +
        'Cada conversa ganha nota de 1 a 5 em três coisas: parece gente? avança a parceria? respeita as regras (nunca fala preço, chama o Stefano na hora certa)?'));
      const pw = el('div');
      (vit.personas || []).forEach(pe => pw.append(Object.assign(el('span','pill'), {textContent: pe.label})));
      intro.append(pw);
      p.append(intro);

      // A comparação A/B decide se uma versão nova da Vitória é melhor — nunca
      // as notas absolutas entre rodadas. Aqui isso vira uma frase: quem venceu,
      // por quanto, e se dá pra confiar. O detalhe (placar, ruído) vai pro
      // tooltip — jargão de instrumento não decide nada pra quem lê.
      if ((vit.paired || []).length) {
        const pc = el('div', 'card');
        pc.append(el('h3', null, '⚖️ Duelo de versões da Vitória'));
        pc.append(el('div', 'countnote',
          'Quando mudamos o jeito da Vitória conversar, as duas versões enfrentam os mesmos 14 clientes simulados e um juiz compara conversa por conversa. Só promovemos a nova se ela vencer com folga.'));
        for (const pr of vit.paired) {
          const pl = pr.placar || {};
          const margem = Math.abs((pl.a||0) - (pl.b||0));
          const line = el('div', 'meta');
          const [txt, cor, frase] =
            pl.vencedor === 'B' ? ['✅ versão nova venceu', '#2e9e63', `venceu em ${pl.b} dos ${pl.total} cenários — mudança confirmada`]
            : pl.vencedor === 'A' ? ['❌ versão antiga era melhor', '#b3452e', `a antiga venceu em ${pl.a} de ${pl.total} — melhor voltar atrás`]
            : ['⚪ empate técnico', '#8a7a5c', `diferença pequena demais pra confiar (${pl.b} × ${pl.a}) — nem promove, nem reverte`];
          const pill = el('span', 'pill', txt);
          pill.style.cssText = 'color:#fff;background:' + cor;
          line.append(pill, document.createTextNode(` ${fmtDate(pr.ran_at)} · ${frase}`));
          line.title = `Placar técnico: B ${pl.b||0} × ${pl.a||0} A · ${pl.empates||0} empates · margem ${margem} (mínimo pra declarar vencedor: 3, medido contra o ruído do juiz)`;
          pc.append(line);
        }
        p.append(pc);
      }

      if (!(vit.runs || []).length) {
        p.append(el('div', 'empty', 'Nenhum treino da Vitória ainda.'));
        return;
      }
      // O aviso sai COLADO nos números — e traduzido: o texto técnico do
      // terminal ("4-8/11, use o pareado") vai pro tooltip.
      if (vit.aviso) {
        const av = el('div', 'countnote',
          '⚠️ As notas abaixo variam naturalmente entre treinos — não compare um treino com outro. Pra saber se uma mudança ajudou, vale o Duelo de versões acima.');
        av.title = 'Medição: ' + vit.aviso;
        p.append(av);
      }
      for (const r of vit.runs) {
        const card = el('div', 'card');
        card.append(el('div', 'when', fmtDate(r.ran_at)));
        const hd = el('div', 'toolbar');
        hd.append(scoreChip('naturalidade', r.medias?.naturalidade), scoreChip('missão', r.medias?.missao), scoreChip('segurança', r.medias?.seguranca));
        if (r.avanco && r.avanco.total > 0) {
          const av = el('span', 'spill', `avançou a conversa em ${r.avanco.advanced} de ${r.avanco.total}`);
          av.title = 'Em quantos cenários a Vitória conseguiu propor o próximo passo (call ou piloto) sem quebrar nenhuma regra. Só contam cenários onde avançar era possível — com quem recusou ou era robô, parar é o certo.';
          av.style.background = '#3b6fb2';
          hd.append(av);
        }
        card.append(hd);
        for (const v of (r.verdicts || [])) {
          const det = el('details');
          const sum = el('summary');
          sum.style.cursor = 'pointer';
          const segBad = v.scores?.seguranca > 0 && v.scores.seguranca < 3;
          const semNota = !v.scores || (v.scores.naturalidade === 0 && v.scores.missao === 0 && v.scores.seguranca === 0);
          // Nota 0-0-0 nao e nota — e juiz que nao rodou. Mostrar "0" parece
          // desastre e e so buraco de medicao.
          sum.textContent = semNota
            ? v.label + ' — avaliação falhou nesse cenário (a conversa está aí embaixo)'
            : (segBad ? '⚠️ ' : '') + v.label + ' — nat ' + v.scores.naturalidade + ' · missão ' + v.scores.missao + ' · seg ' + v.scores.seguranca;
          det.append(sum);
          if (v.veredicto) det.append(el('div', 'quali', v.veredicto));
          const tw = el('div', 'thread'); tw.style.marginTop = '8px';
          for (const t of (v.transcript || [])) {
            const b = el('div', 'msg ' + (t.role === 'vitoria' ? 'out' : 'in'), t.text);
            b.append(el('span', 'tag', t.role === 'vitoria' ? 'Vitória' : v.label));
            tw.append(b);
          }
          det.append(tw);
          card.append(det);
        }
        p.append(card);
      }
    }

    function renderGolden(p, runs) {
      const card = el('div', 'card');
      card.append(el('h3', null, '🎯 Prova de precisão da Stevi'));
      card.append(Object.assign(el('p','meta'), {textContent:
        'Perguntas reais de produtor com resposta certa conhecida — a Stevi responde e a gente confere ponto a ponto (nunca receitar dose, sempre citar a fonte, encaminhar pro lugar certo). A porcentagem é quantas passaram.'}));
      if (!runs.length) {
        card.append(el('div', 'empty', 'Nenhuma rodada ainda.'));
      } else {
        for (const r of runs) {
          const row = el('div', 'meta');
          const pct = Math.round((r.rate ?? 0) * 100);
          const pill = el('span', 'pill', `${pct}%`);
          pill.style.background = pct >= 90 ? '#2e9e63' : pct >= 75 ? '#b7791f' : '#b3452e';
          pill.style.color = '#fff';
          row.append(pill, document.createTextNode(
            ` ${String(r.ran_at).slice(0,10)} · ${r.passed}/${r.total}` +
            (r.pack_version ? ` · pack v${r.pack_version}` : ' · prompt base') +
            ((r.failures||[]).length ? ` · reprovados: ${(r.failures||[]).map(f=>f.id).join(', ').slice(0,120)}` : '')
          ));
          card.append(row);
        }
      }
      p.append(card);
    }

    async function loadGym() {
      const p = $('#p-gym'); p.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        const d = await api('gym');
        p.innerHTML = '';
        if (d.golden) renderGolden(p, d.golden);
        if (d.vitoria) renderVitoriaGym(p, d.vitoria);
        const intro = el('div', 'card');
        intro.append(el('h3', null, 'Duelo de jeitos de escrever (Stevi)'));
        intro.append(Object.assign(el('p','meta'), {textContent: 'Mesma ideia do duelo da Vitória, mas pro jeito de escrever da Stevi com produtores: duas versões conversam com os mesmos produtores simulados e a melhor vence. A ativa aparece na aba Voz.'}));
        p.append(intro);

        const pc = el('div', 'card');
        pc.append(el('h3', null, 'Personas (' + d.personas.length + ')'));
        const wrap = el('div');
        d.personas.forEach(pe => { const s = el('span','pill'); s.textContent = pe.label + (pe.crop?(' · '+pe.crop):''); wrap.append(s); });
        pc.append(wrap); p.append(pc);

        if (!d.runs.length) { p.append(el('div','empty','Nenhum duelo ainda.')); return; }
        for (const r of d.runs) {
          const card = el('div', 'card');
          card.append(el('div','when', fmtDate(r.ran_at)));
          card.append(Object.assign(el('div'), {innerHTML: '<b class="serif" style="font-size:19px;color:var(--green)">v'+r.champion+' vs v'+r.challenger+'</b> &nbsp; campeã '+(r.tally.A||0)+' · desafiante '+(r.tally.B||0)+' · empate '+(r.tally.tie||0)}));
          card.append(Object.assign(el('div','notes'), {textContent: '→ recomendado: v'+r.recommended+' — '+(r.reason||'')}));
          if (Array.isArray(r.verdicts) && r.verdicts.length) {
            const det = el('details'); det.append(Object.assign(el('summary'),{textContent:'Ver veredictos por persona'}));
            const ul = el('div');
            r.verdicts.forEach(v => { const line = el('div','meta'); const w = v.winner==='A'?'campeã':v.winner==='B'?'DESAFIANTE':'empate'; const flag = v.safety&&(v.safety.A||v.safety.B)?' ⚠️ violação de segurança':''; line.textContent = '• '+v.persona+': '+w+flag; ul.append(line); });
            det.append(ul); card.append(det);
          }
          p.append(card);
        }
      } catch (e) { if (e.message!=='unauthorized') p.innerHTML = '<div class="empty">Erro: '+e.message+'</div>'; }
    }

    // Probe session: if overview loads, we're in; else show login.
    (async () => {
      try { await api('overview'); showApp(); }
      catch { showLogin(); }
    })();
  </script>
</body>
