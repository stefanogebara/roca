<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Fonte do og-image.png (1200×630). Renderizado headless; não é linkado
       pelo site. Sistema de design v2 (ver README.md): tinta + creme, cereja
       uma vez, Big Shoulders Display caixa-alta. A foto é o poster do hero. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Hanken+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root { --creme: #F4F0E4; --tinta: #15130F; --cinza-claro: #A9A292; --cereja: #D6321B; }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body { position: relative; overflow: hidden; background: var(--tinta); color: var(--creme); font-family: "Hanken Grotesk", sans-serif; }
    .foto { position: absolute; inset: 0; }
    .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 74% 35%; }
    .foto::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(21,19,15,.92) 0%, rgba(21,19,15,.78) 38%, rgba(21,19,15,.15) 72%, rgba(21,19,15,0) 100%),
                  linear-gradient(180deg, rgba(21,19,15,.25) 0%, rgba(21,19,15,0) 40%, rgba(21,19,15,.6) 100%); }
    .conteudo { position: relative; z-index: 1; height: 100%; padding: 56px 64px 52px; display: flex; flex-direction: column; }
    .wordmark { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; text-transform: uppercase; font-size: 40px; letter-spacing: .01em; display: inline-flex; align-items: baseline; gap: 6px; }
    .wordmark i { width: 14px; height: 14px; border-radius: 50%; background: var(--cereja); transform: translateY(1px); }
    .rotulo { margin-top: auto; font-size: 17px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--cinza-claro); margin-bottom: 18px; }
    h1 { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; text-transform: uppercase; font-size: 212px; line-height: .84; letter-spacing: -.01em; }
    .base { margin-top: 30px; display: flex; align-items: center; gap: 22px; font-size: 21px; font-weight: 500; }
    .base b { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 18px; color: var(--cinza-claro); }
    .pilula { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border: 1.5px solid var(--creme); border-radius: 999px; font-size: 19px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="foto"><img src="media/hero-desktop-poster.jpg" alt="" /></div>
  <div class="conteudo">
    <div class="wordmark">Stevi<i></i></div>
    <div class="rotulo">Assistente agronômica no WhatsApp</div>
    <h1>Manda<br />a foto.</h1>
    <div class="base">
      <span class="pilula">Triagem, não prescrição</span>
      <b>quem receita é o agrônomo</b>
    </div>
  </div>
</body>
</html>
